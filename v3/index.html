<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>双截棍大冒险 V3</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=3.0">
</head>
<body>
  <main class="game-shell">
    <section class="stage-wrap" aria-label="双截棍大冒险 V3 游戏区域">
      <canvas id="game" width="960" height="540"></canvas>
      <div class="touch-pad" aria-label="触控操作">
        <button class="touch-btn move" type="button" data-key="ArrowLeft" aria-label="向左">←</button>
        <button class="touch-btn move" type="button" data-key="ArrowRight" aria-label="向右">→</button>
        <button class="touch-btn jump" type="button" data-key=" " aria-label="跳跃">↑</button>
        <button class="touch-btn dash" type="button" data-key="k" aria-label="冲刺">K</button>
        <button class="touch-btn attack" type="button" data-key="j" aria-label="攻击">J</button>
        <button class="touch-btn skill" type="button" data-key="l" aria-label="Fever">L</button>
      </div>
      <div id="overlay" class="overlay">
        <div class="mark">V3 WORLD TOUR</div>
        <h1>双截棍大冒险</h1>
        <p>五幕世界巡演：街区、屋顶、水城、工厂、终极舞台。连击、Fever、滑翔、传送门和多路线关卡全部上线。</p>
        <button id="startBtn" type="button">开启世界巡演</button>
      </div>
    </section>

    <aside class="hud" aria-label="游戏状态">
      <div class="scoreboard">
        <div class="stat"><span>音符</span><strong id="score">0</strong></div>
        <div class="stat"><span>生命</span><strong id="lives">5</strong></div>
        <div class="stat"><span>连击</span><strong id="combo">x1</strong></div>
        <div class="stat"><span>时间</span><strong id="timer">300</strong></div>
      </div>
      <div class="meters">
        <label><span>冲刺</span><i><b id="dashMeter"></b></i></label>
        <label><span>Fever</span><i><b id="feverMeter"></b></i></label>
        <label><span>进度</span><i><b id="progressMeter"></b></i></label>
      </div>
      <div class="mission">
        <b id="actName">稻香街区</b>
        <span id="missionText">收集音符，穿过第一幕。</span>
      </div>
      <div class="controls">
        <span>A/D 或 ←/→ 移动</span>
        <span>W/↑/Space 跳跃，空中长按可滑翔</span>
        <span>J 双截棍，K/Shift 冲刺</span>
        <span>L 释放 Fever，R 重开</span>
        <a class="version-link" href="../versions.html">版本列表</a>
      </div>
    </aside>
  </main>
  <script type="module" src="src/main.js?v=3.0"></script>
</body>
</html>
