<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>双截棍大冒险 V3</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=3.8">
</head>
<body>
  <main class="game-shell">
    <section class="stage-wrap" aria-label="双截棍大冒险 V3 游戏区域">
      <canvas id="game" width="960" height="540"></canvas>
      <div class="ingame-hud" aria-label="游戏状态">
        <div class="scoreboard">
          <div class="stat score-stat"><span>♪</span><strong id="score">0</strong></div>
          <div class="stat lives-stat"><span>♥</span><strong id="lives">5</strong></div>
          <div class="stat combo-stat"><span>COMBO</span><strong id="combo">x1</strong></div>
          <div class="stat time-stat"><span>TIME</span><strong id="timer">300</strong></div>
        </div>
        <div class="meters">
          <label class="dash-meter"><span>K 冲刺</span><i><b id="dashMeter"></b></i></label>
          <label class="fever-meter"><span>L Fever</span><i><b id="feverMeter"></b></i></label>
          <label class="progress-meter"><span>STAGE</span><i><b id="progressMeter"></b></i></label>
        </div>
        <div class="mission">
          <b id="actName">稻香街区</b>
          <span id="missionText">收集音符，穿过第一幕。</span>
        </div>
      </div>
      <div class="touch-pad" aria-label="触控操作">
        <button class="touch-btn move" type="button" data-key="ArrowLeft" aria-label="向左">←</button>
        <button class="touch-btn move" type="button" data-key="ArrowRight" aria-label="向右">→</button>
        <button class="touch-btn jump" type="button" data-key=" " aria-label="跳跃">↑</button>
        <button class="touch-btn dash" type="button" data-key="k" aria-label="冲刺">K</button>
        <button class="touch-btn attack" type="button" data-key="j" aria-label="攻击">J</button>
        <button class="touch-btn skill" type="button" data-key="l" aria-label="Fever">L</button>
      </div>
      <div id="overlay" class="overlay">
        <div class="mark">V3 WORLD TOUR</div>
        <h1>双截棍大冒险</h1>
        <p>五个独立关卡包：脆弱屋顶、钥匙瓷门、冲刺环云轨、火箭轨道和 Fever 终演门阵。通关后进入下一关。</p>
        <button id="startBtn" type="button">开启世界巡演</button>
      </div>
      <div id="deathOverlay" class="death-overlay hidden">
        <strong>MISS</strong>
        <span id="deathText">回到安全点</span>
      </div>
    </section>

    <aside class="guide-panel" aria-label="操作说明">
      <div class="controls">
        <span>A/D 或 ←/→ 移动</span>
        <span>W/↑/Space 跳跃，空中长按可滑翔</span>
        <span>J 双截棍，K/Shift 冲刺破敌穿空隙</span>
        <span>L Fever：短时间加速、减速敌人、强化得分</span>
        <a class="version-link" href="../versions.html">版本列表</a>
      </div>
    </aside>
  </main>
  <script type="module" src="src/main.js?v=3.8"></script>
</body>
</html>
