<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>双截棍大冒险 V2</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=2.1">
</head>
<body>
  <main class="game-shell">
    <section class="stage-wrap" aria-label="双截棍大冒险 V2 游戏区域">
      <canvas id="game" width="960" height="540"></canvas>
      <div class="touch-pad" aria-label="触控操作">
        <button class="touch-btn move" type="button" data-key="ArrowLeft" aria-label="向左">←</button>
        <button class="touch-btn move" type="button" data-key="ArrowRight" aria-label="向右">→</button>
        <button class="touch-btn jump" type="button" data-key=" " aria-label="跳跃">↑</button>
        <button class="touch-btn dash" type="button" data-key="k" aria-label="冲刺">K</button>
        <button class="touch-btn attack" type="button" data-key="j" aria-label="攻击">J</button>
      </div>
      <div id="overlay" class="overlay">
        <div class="mark">V2</div>
        <h1>双截棍大冒险</h1>
        <p>穿过霓虹音乐街区，收集音符和黑胶唱片，冲进最终舞台。</p>
        <button id="startBtn" type="button">开始巡演</button>
      </div>
    </section>
    <aside class="hud" aria-label="游戏状态">
      <div class="stat"><span>音符</span><strong id="score">0</strong></div>
      <div class="stat"><span>生命</span><strong id="lives">3</strong></div>
      <div class="stat"><span>时间</span><strong id="timer">150</strong></div>
      <div class="meter">
        <span>冲刺</span>
        <i><b id="dashMeter"></b></i>
      </div>
      <div class="meter">
        <span>进度</span>
        <i><b id="progressMeter"></b></i>
      </div>
      <div class="controls">
        <span>A/D 或 ←/→ 移动</span>
        <span>W/↑/Space 跳跃</span>
        <span>J 双截棍</span>
        <span>K / Shift 冲刺</span>
        <span>R 重新开始</span>
      </div>
    </aside>
  </main>
  <script src="game.js?v=2.1"></script>
</body>
</html>
