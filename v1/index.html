<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>双截棍大冒险</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <section class="stage-wrap" aria-label="双截棍大冒险游戏区域">
      <canvas id="game" width="960" height="540"></canvas>
      <div class="touch-pad" aria-label="触控操作">
        <button class="touch-btn" type="button" data-key="ArrowLeft" aria-label="向左">←</button>
        <button class="touch-btn" type="button" data-key="ArrowRight" aria-label="向右">→</button>
        <button class="touch-btn" type="button" data-key=" " aria-label="跳跃">↑</button>
        <button class="touch-btn" type="button" data-key="j" aria-label="攻击">J</button>
      </div>
      <div id="overlay" class="overlay">
        <h1>双截棍大冒险</h1>
        <p>原创横版平台游戏。收集音符，躲开狗仔镜头，冲到演唱会舞台。</p>
        <button id="startBtn" type="button">开始游戏</button>
      </div>
    </section>
    <aside class="hud" aria-label="游戏状态">
      <div class="stat"><span>音符</span><strong id="score">0</strong></div>
      <div class="stat"><span>生命</span><strong id="lives">3</strong></div>
      <div class="stat"><span>时间</span><strong id="timer">120</strong></div>
      <div class="controls">
        <span>移动 A/D 或 ←/→</span>
        <span>跳跃 W / ↑ / Space</span>
        <span>攻击 J</span>
        <span>重新开始 R</span>
        <a class="version-link" href="../versions.html">版本列表</a>
      </div>
    </aside>
  </main>
  <script src="game.js"></script>
</body>
</html>
